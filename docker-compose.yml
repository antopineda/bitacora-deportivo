services:
  web:
    build: .
    env_file: .env
    command: bundle exec puma -C config/puma.rb
    depends_on: [db]
    volumes:
      - .:/rails
    networks: [net]

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: clavesecreta123
      POSTGRES_USER: postgres
      POSTGRES_DB: app_production
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks: [net]

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on: [web]
    networks: [net]

networks:
  net:

volumes:
  dbdata:
